name: taxiuser
description: "Kranti Cabs - premium ride booking experience."
publish_to: 'none'

version: 1.0.0+15

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # Ships Material/Cupertino strings and date formats for every locale the app
  # offers, so switching the app language translates the framework widgets too.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.3

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # Location & maps
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Firebase
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # Real-time
  socket_io_client: ^2.0.3+1

  # In-App Update & Review
  in_app_update: ^4.2.5
  in_app_review: ^2.0.12

  # Payments
  razorpay_flutter: ^1.3.7

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  pin_code_fields: ^8.0.1
  lottie: ^3.2.0
  flutter_svg: ^2.0.16
  smooth_page_indicator: ^1.2.0
  fl_chart: ^0.69.2

  # Audio
  audioplayers: ^6.1.0

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  uuid: ^4.5.1
  equatable: ^2.0.7
  logger: ^2.5.0
  package_info_plus: ^8.3.0
  device_info_plus: ^11.3.0

  # Speech
  flutter_tts: ^4.2.5
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons: 
  android: "ic_launcher"
  ios: true
  image_path: "tool/launcher_icon/logo.png"
  min_sdk_android: 21
  background_color: "#ffffff"
  

flutter:
  uses-material-design: true
  # Builds AppLocalizations from lib/l10n/*.arb — see l10n.yaml.
  generate: true
  assets:
    - assets/
    - assets/audio/
